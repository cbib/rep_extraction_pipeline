# Maintained interface summary; runtime state belongs in run logs, not this file.
meta:
  project: TE_Pipeline
  last_updated: "2026-09-28"
  description: RepeatMasker annotation and transcript TE feature analysis.
  driver_env: workflow/envs/te_driver.yaml
  slurm_driver_env: workflow/envs/te_driver_slurm.yaml
  analysis_env: workflow/envs/te_analysis.yaml
  configs:
    gencode_v47: config/config_47.yaml
    gencode_v49: config/config_49.yaml
    gencode_v47_unspliced: config/config_47_unspliced.yaml
    gencode_v47_unspliced_chunks: config/config_47_unspliced_chunks.yaml
    gencode_v49_unspliced: config/config_49_unspliced.yaml
entry_points:
  full_pipeline:
    file: Snakefile
    target_rule: all
    config_required: true
    example: >-
      snakemake --snakefile Snakefile --configfile config/config_47_unspliced_chunks.yaml
      --profile profiles/default --cores 8
  features_only:
    file: Snakefile
    target_rule: pipeline_all_features
    output: results/{dataset}/features/all_transcripts_te_features.csv
  subset_only:
    file: Snakefile
    target_rule: create_subset_gtf
profiles:
  local: profiles/default
  slurm: profiles/slurm
sequence_modes:
  spliced:
    input: gencode_fasta
    length_normalization: Sum of GTF exon lengths.
  unspliced:
    input: genome_fasta
    length_normalization: GTF transcript genomic span, including introns.
    dataset_suffix: _unspliced
classification_modes:
  fasta: [pc_transcripts_fasta, lncrna_transcripts_fasta]
  id_file: [pc_transcript_ids_file, lncrna_transcript_ids_file]
rule_groups:
  subset:
    optional_when: source_gtf is supplied
    rules: [extract_fasta_ids_for_subset, subset_gtf]
  annotation:
    rules: [parse_gencode_gtf, extract_transcript_lengths, extract_ids_from_fasta]
    outputs:
      - results/{dataset}/annotation/transcripts_from_gtf.bed
      - results/{dataset}/annotation/transcript_biotypes.txt
      - results/{dataset}/annotation/transcript_lengths.txt
  sequences:
    rules: [prepare_transcript_fasta, index_transcripts, check_fasta_headers]
    output: results/{dataset}/annotation/all_transcripts_headers_checked.fa
  repeats:
    rules: [split_fasta_for_repeatmasker, run_repeatmasker_chunk, merge_repeatmasker_chunks]
    n_chunks: Positive integer; defaults to 1.
    outputs:
      - results/{dataset}/repeatmasker/all_transcripts.out
      - results/{dataset}/repeatmasker/all_transcripts.out.gff
  features:
    rules: [extract_all_features, filter_features_by_class, combine_classified_features]
    outputs:
      - results/{dataset}/features/all_transcripts_te_features.csv
      - results/{dataset}/features/pc_transcripts_te_features.csv
      - results/{dataset}/features/lncrna_transcripts_te_features.csv
      - results/{dataset}/combined/classified_te_features.csv
  analysis:
    rules: [statistical_analysis, generate_visualizations]
    primary_outputs:
      - results/{dataset}/analysis/summary_report.txt
      - results/{dataset}/analysis/univariate_tests.csv
      - results/{dataset}/analysis/categorical_tests.csv
      - results/{dataset}/analysis/pca_scores.csv
      - results/{dataset}/plots/hit_presence_comparison.png
      - results/{dataset}/plots/volcano_plot.png
      - results/{dataset}/plots/pca_plot.png
    auxiliary_script_outputs:
      - results/{dataset}/analysis/feature_importance.csv
      - results/{dataset}/analysis/pca_loadings.csv
      - results/{dataset}/analysis/pca_variance.csv
      - results/{dataset}/plots/hit_coverage_comparison.png
      - results/{dataset}/plots/hit_family_composition.png
    auxiliary_note: These script outputs are not currently tracked as rule outputs.
recovery:
  supported: Rerun normal workflow with --rerun-incomplete using the same configuration.
  unsupported: Automatic recovery from RepeatMasker .cat files.
  retention: Preserve untracked RM_* work directories until their retention is decided.
release_limits:
  - Environment specifications are not solved lockfiles.
  - Reference data and repeat libraries must be supplied and their provenance recorded.
  - repeatmasker_lib is a legacy unused config key; RepeatMasker uses its installed library.
  - Historical run completeness does not establish clean-environment reproducibility.
  - Configurations sharing output paths must not run concurrently.
  - Separate memory-optimization branch and stashes are not part of this release.
